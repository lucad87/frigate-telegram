name: Build and push Docker image to Dockerhub

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
    
jobs:
  build:
    runs-on: ubuntu-latest
    # the release tag is pushed back to the repo at the end of the job
    permissions:
      contents: write
    steps:
    - name: Check out the repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract version from package.json
      id: get_version
      run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

    # PRs are published as :next for testing, master as :latest plus the released version
    - name: Compute image tags
      id: tags
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "tags=lucad87/frigate-telegram:next" >> "$GITHUB_OUTPUT"
        else
          {
            echo "tags<<TAGS_EOF"
            echo "lucad87/frigate-telegram:latest"
            echo "lucad87/frigate-telegram:v${{ steps.get_version.outputs.version }}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Login to Dockerhub
      if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push to Dockerhub
      if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true
      id: docker_build
      uses: docker/build-push-action@v5
      with:
        push: true
        tags: ${{ steps.tags.outputs.tags }}

    # dependabot PRs and forks do not receive the Docker Hub secrets, so they only build
    - name: Build without pushing
      if: github.actor == 'dependabot[bot]' || github.event.pull_request.head.repo.fork == true
      uses: docker/build-push-action@v5
      with:
        push: false

    - name: Image digest
      if: steps.docker_build.outputs.digest != ''
      run: echo ${{ steps.docker_build.outputs.digest }}

    - name: Set up Git user
      if: github.ref == 'refs/heads/master'
      run: |
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"

    - name: Create new git tag
      if: github.ref == 'refs/heads/master'
      env:
        TAG: v${{ steps.get_version.outputs.version }}
      run: |
        if ! git rev-parse "$TAG" >/dev/null 2>&1; then
          git tag "$TAG"
          git push origin "$TAG"
        else
          echo "Tag $TAG already exists"
        fi

    # turns the tag into a GitHub release, so the Releases page follows the
    # version instead of stopping at the last hand-made one
    - name: Create the GitHub release
      if: github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: v${{ steps.get_version.outputs.version }}
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists"
        else
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
        fi

    # Docker Hub does not follow the repository: the image is pushed from here,
    # not built by a Docker Hub automated build, so its description stayed on an
    # old copy of the README. Push README.md as the repository description on
    # every master build so the two cannot drift apart again.
    - name: Update the Docker Hub description from the README
      if: github.ref == 'refs/heads/master'
      uses: peter-evans/dockerhub-description@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        repository: lucad87/frigate-telegram
        readme-filepath: ./README.md
